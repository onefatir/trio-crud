spring.application.name=triocrud
# 1. Konfigurasi Koneksi Database PostgreSQL (bisa di-override lewat env DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triocrud}
spring.datasource.username=${DB_USERNAME:skylar}
spring.datasource.password=${DB_PASSWORD:}
# 2. Konfigurasi JPA & Hibernate (Untuk membuat/mencocokkan tabel otomatis)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# 3. Session cuma lewat cookie (biar URL redirect tidak ada ;jsessionid=...)
server.servlet.session.tracking-modes=cookie
